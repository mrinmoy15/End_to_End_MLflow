[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_project"
version = "0.1.0"
requires-python = ">=3.8"
authors = [
  {name = "Mrinmoy Bhuyan", email = "mrinmoybhuyan007@gmail.com"},
]

dependencies = [
    "requests",
    "numpy",
    "pandas>=2.0.3",
    "mlflow>=2.17.2",
    "notebook>=7.3.3",
    "scikit-learn>=1.3.2",
    "matplotlib>=3.7.5",
    "seaborn>=0.13.2",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.3",
    "joblib>=1.4.2",
    "ensure>=1.0.4",
    "flask>=3.0.3",
    "flask-cors>=5.0.0",
    "types-pyyaml>=6.0.12.20241230",
    "python-box>=7.2.0",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "mypy",
]
